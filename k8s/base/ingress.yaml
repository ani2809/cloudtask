apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtask-ingress
  namespace: cloudtask
spec:
  ingressClassName: nginx
  rules:
    - host: cloudtask.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudtask-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtask-frontend
                port:
                  number: 80