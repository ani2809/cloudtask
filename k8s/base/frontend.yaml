apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtask-frontend
  namespace: cloudtask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudtask-frontend
  template:
    metadata:
      labels:
        app: cloudtask-frontend
    spec:
      containers:
        - name: frontend
          image: cloudtask-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloudtask-frontend
  namespace: cloudtask
spec:
  selector:
    app: cloudtask-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP